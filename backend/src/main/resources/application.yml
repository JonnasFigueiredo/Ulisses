server:
  port: 8080
  tomcat:
    # O cadastro/validacao envia dezenas de frames + fases no mesmo multipart
    max-part-count: 200

spring:
  datasource:
    url: jdbc:h2:file:./data/ulisses
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 120MB

logging:
  level:
    com.ulisses: INFO

ulisses:
  jwt:
    # Sobrescreva em producao com a variavel de ambiente ULISSES_JWT_SECRET (ver perfil prod)
    secret: ${ULISSES_JWT_SECRET:ulisses-dev-secret-key-nao-use-em-producao-9f4b2c7e1a8d6f3b5e0c9a7d4f2b8e6c}
    expiration-minutes: 480
  crypto:
    # Chave para cifrar os templates biometricos em repouso (AES-256-GCM). Vazio = dev (sem cifra).
    key: ${ULISSES_CRYPTO_KEY:}
  cors:
    # Origens permitidas (separadas por virgula). "*" apenas em dev; restrinja em producao.
    allowed-origins: ${ULISSES_CORS_ORIGINS:*}
  face:
    # Modelos ONNX do pacote InsightFace buffalo_l (SCRFD det_10g + ArcFace w600k_r50).
    # Baixados uma unica vez no primeiro start; toda a inferencia roda 100% local.
    models-dir: ./models
    detection-model-url: https://huggingface.co/immich-app/buffalo_l/resolve/main/detection/model.onnx
    recognition-model-url: https://huggingface.co/immich-app/buffalo_l/resolve/main/recognition/model.onnx
    # Limiar experimental de similaridade de cosseno. Nao equivale a uma FMR conhecida.
    # Calibre com pares genuinos/impostores e valide em um conjunto separado antes de adotar.
    match-threshold: 0.45
    min-detection-score: 0.60
    min-face-size: 80
    # Heuristica de qualidade: distancia interocular minima, em pixels, no cadastro frontal.
    # Este filtro isolado nao demonstra conformidade com uma norma de qualidade biometrica.
    min-enroll-interocular: 60
    # Nitidez minima do rosto alinhado (variancia do Laplaciano). Frames borrados por movimento
    # ou foco ruim sao descartados; rostos nitidos de webcam ficam bem acima de 100.
    min-sharpness: 40
    challenge-ttl-seconds: 120
    # Inclui os desafios verticais (cima/baixo) no sorteio. O sinal de pitch agora e roll-corrigido
    # e normalizado pela altura olhos-boca (bem mais estavel). Se no seu dispositivo o cima/baixo
    # ficar dificil de confirmar, ajuste min-pitch-deviation ou volte para false (so esquerda/direita).
    include-vertical-challenges: true
    # Liveness PASSIVA (anti-spoofing por textura) — ensemble MiniFASNet / Silent-Face (Apache-2.0).
    # Segunda camada alem da prova de vida ativa (giro de cabeca). Detecta foto/tela pela textura.
    # IMPORTANTE: threshold e live-class-index PRECISAM ser calibrados contra um dataset real de
    # ataques com o harness (PadEvaluationTest). Isto NAO substitui certificacao ISO 30107-3.
    passive-liveness:
      enabled: true
      model-v2-url: https://github.com/yakhyo/face-anti-spoofing/releases/download/weights/MiniFASNetV2.onnx
      model-v1se-url: https://github.com/yakhyo/face-anti-spoofing/releases/download/weights/MiniFASNetV1SE.onnx
      # Contrato dos modelos MiniFASNet fornecidos por yakhyo: classe 1 = vivo; 0 e 2 = ataque.
      live-class-index: 1
      # Score minimo de liveness passiva (mediana entre os frames frontais) para aceitar
      threshold: 0.55
