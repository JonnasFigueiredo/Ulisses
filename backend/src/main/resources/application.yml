server:
  port: 8080
  tomcat:
    # O cadastro/validacao envia dezenas de frames + fases no mesmo multipart
    max-part-count: 200

spring:
  datasource:
    url: jdbc:h2:file:./data/ulisses
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 120MB

logging:
  level:
    com.ulisses: INFO

ulisses:
  jwt:
    # Sobrescreva em producao com a variavel de ambiente ULISSES_JWT_SECRET
    secret: ${ULISSES_JWT_SECRET:ulisses-dev-secret-key-nao-use-em-producao-9f4b2c7e1a8d6f3b5e0c9a7d4f2b8e6c}
    expiration-minutes: 480
  face:
    # Modelos ONNX do pacote InsightFace buffalo_l (SCRFD det_10g + ArcFace w600k_r50).
    # Baixados uma unica vez no primeiro start; toda a inferencia roda 100% local.
    models-dir: ./models
    detection-model-url: https://huggingface.co/immich-app/buffalo_l/resolve/main/detection/model.onnx
    recognition-model-url: https://huggingface.co/immich-app/buffalo_l/resolve/main/recognition/model.onnx
    # Limiar de decisao 1:1 (similaridade de cosseno, ArcFace). Pontos de operacao tipicos:
    #   0.38 = conveniencia (FMR ~1:1.000)  |  0.42 = equilibrado (~1:10.000, requisito FIDO)
    #   0.45 = recomendado (~1:100.000, folga sobre o FIDO)  |  0.50 = alta seguranca
    # Mesmo rosto em condicoes normais fica acima de 0.55; rostos diferentes abaixo de 0.30.
    match-threshold: 0.45
    min-detection-score: 0.60
    min-face-size: 80
    # Qualidade da imagem de cadastro (ISO/IEC 19794-5): distancia interocular minima, em pixels,
    # exigida nos frames frontais do cadastro. Garante template com resolucao suficiente.
    min-enroll-interocular: 60
    challenge-ttl-seconds: 120
