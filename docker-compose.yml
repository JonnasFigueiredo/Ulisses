# Sobe o Ulisses completo (backend + frontend) com um comando: docker compose up --build
# Copie .env.example para .env e gere dois segredos independentes antes de iniciar.

services:
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ULISSES_JWT_SECRET: ${ULISSES_JWT_SECRET:?Defina um segredo aleatorio em .env (veja README)}
      ULISSES_CRYPTO_KEY: ${ULISSES_CRYPTO_KEY:?Defina uma chave aleatoria em .env (veja README)}
      ULISSES_CORS_ORIGINS: ${ULISSES_CORS_ORIGINS:-http://localhost:5173,https://localhost,capacitor://localhost}
    volumes:
      - ulisses-data:/app/data
      - ulisses-models:/app/models
    ports:
      - "${ULISSES_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${ULISSES_BIND_ADDRESS:-127.0.0.1}:5173:80"
    restart: unless-stopped

volumes:
  ulisses-data:
  ulisses-models:
