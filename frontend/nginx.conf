server {
    listen 80;
    server_name _;

    # Uploads de video (dezenas de frames) precisam de limite generoso.
    client_max_body_size 120m;

    # Encaminha a API para o backend (mesma origem para o navegador -> sem CORS no fluxo web).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA: qualquer rota cai no index.html (React Router cuida do resto).
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
