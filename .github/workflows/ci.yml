name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testes unitarios
        working-directory: backend
        run: sh mvnw -B verify

  frontend:
    name: Frontend (testes e build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Build de producao
        working-directory: frontend
        run: npm run build
      - name: Testes do cliente HTTP
        working-directory: frontend
        run: npm test

  docker:
    name: Imagens Docker (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build das imagens
        env:
          # Valores usados somente para interpolar o Compose no build; nenhum container inicia.
          ULISSES_JWT_SECRET: ci-build-only-no-runtime-jwt-value
          ULISSES_CRYPTO_KEY: ci-build-only-no-runtime-crypto-value
        run: docker compose build

  ios:
    name: App iOS (build sem assinatura)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar e buildar o web
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx cap sync ios
      - name: Compilar o app iOS (simulador, sem assinatura)
        working-directory: frontend/ios/App
        run: |
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
